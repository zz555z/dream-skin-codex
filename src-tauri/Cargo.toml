[package]
name = "dream-skin-app"
version = "1.2.14"
description = "Codex Dream Skin desktop control panel"
authors = ["local"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.1.0", features = [] }

[dependencies]
base64 = "0.22"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.1.0", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2.0"

[lib]
name = "dream_skin_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dream-skin-app"
path = "src/main.rs"
